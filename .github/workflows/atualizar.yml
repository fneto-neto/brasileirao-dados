name: Atualizar dados do Brasileirão

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (o GitHub pode atrasar alguns minutos em horário de pico)
  workflow_dispatch: {}      # botão "Run workflow" na aba Actions

permissions:
  contents: write            # só para commitar os JSON em docs/api

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Buscar no Opta e gerar os JSON
        env:
          OPTA_BASE_URL: ${{ secrets.OPTA_BASE_URL }}
          OPTA_OUTLET_KEY: ${{ secrets.OPTA_OUTLET_KEY }}
          OPTA_API_KEY: ${{ secrets.OPTA_API_KEY }}
        run: |
          # o GitHub já mascara os secrets nos logs; mascara também o host do proxy
          host="$(printf '%s' "$OPTA_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          [ -n "$host" ] && echo "::add-mask::$host"
          python gerar_api.py

      - name: Commitar só se os dados mudaram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          if git diff --cached --quiet; then
            echo "Sem mudança nos dados."
          else
            git commit -m "Dados atualizados $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
